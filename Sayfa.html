<!DOCTYPE html>
<html>
    <head>
        <style>
            #sayfa{
                border-style: solid;
                width: 400px;
                margin: auto; /* sayfa ortalandı */
                background-color: bisque;
            }

            header{
                border-style: dotted;
                border-color: brown;
                background-color: lightgreen;
                width: 290px;
                margin: auto;
                height: 50px;
            }

            nav{
                border-style: dashed;
                border-color: brown;
                background-color:lightpink;
                width: 290px;
                margin: auto;
                height: 200px;
            }
            article{
                border-style: dashed;
                border-color: brown;
                background-color:lightskyblue;
                width: 290px;
                margin: auto;
                height: 50px;
            }
            footer{
                border-style: dashed;
                border-color: brown;
                background-color: lightyellow;
                width: 290px;
                margin: auto;
                height: 50px;
            }
        </style>
    </head>
    <body>
        <div id="sayfa">
            <header>
                Buraya logo ve reklam gelecek
            </header>

            <nav>
                Buraya ana menü gelecek
            </nav>

            <article>
                Burası içerik bölümü
            </article>

            <footer>
                Burası sayfanın en altı
            </footer>
        </div>
    </body>
</html>
