<!DOCTYPE html>
<html>
    <head>
        <style>
            table{
                color: palevioletred;
                background-color: burlywood;
                border-collapse: collapse; /* tablo kenarlıkları tek bir kenarlığa dönüşür */
            }
            th{
                font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
                font-size: 16px;
                font-weight: bolder;
                background-color: brown;
                padding: 10px;
                margin: 10px
            }
            td{
                font-style: italic;
                font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
                color: black;
                text-align: center;
                padding: 10px;
                vertical-align: middle;
                height: 30px;
            }
        </style>
    </head>
    <body>
        <table border="1">
            <tr><th>Ülke</th><th>Nüfus</th></tr>
            <tr><td>Türkiye</td><td>81</td></tr>
            <tr><td>Yunanistan</td><td>12</td></tr>
            <tr><td>Bulgaristan</td><td>9</td></tr>
        </table>
    </body>
</html>
