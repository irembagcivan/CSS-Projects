<!DOCTYPE html>
<html>
    <head>
        <style>
            #altmenu{
                background-color: khaki;
                border-style: solid;
                border-width: 5px;
                border-color: aqua;
                width: 300px;
                margin: auto; /* kutuyu sayfaya ortaladık */
                text-align: center; /* metni kutunun içinde ortaladık */
                padding: 10px;
                color: hotpink;
                font-size: 20px;
                font-weight: bolder;
            }
            a{
                font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
                font-size: 20px;
                text-decoration: none; /* linklerin altındaki çizgi kaldırılır */
            }
            a:link{ /* ziyaret edilmeyen linkler */
                color: blueviolet;
            }
            a:visited{ /* ziyaret edilen linkler */
                color: brown; 
            }
            a:hover{ /* fare üzerinde gidildiğinde*/
                color: green;
                text-decoration: none; /* altına çizgi gelecek*/
            }
            a:active{ /* link aktif olduğunda (elemanın üzerinde faenin sol tuşuyla basıp tuttuğumuz an) */
                color: grey;
            }


        </style>
    </head>
    <body>
        <nav id="altmenu">
            <a href="index.html">Anasayfa</a> |
            <a href="urunlerimiz.html">Ürünlerimiz</a> |

    </body>
</html>
