<!DOCTYPE html>
<html>
    <head>
        <style>
            h1,h2{
                color: brown;
            }
            
            h2 u{ 
                /* h2 etiketinin içerisinde u tag ının içerisinde yer alanların rengi değişir */
                color: deepskyblue; 
            }

            p #mi{
                color: blue;
                font-style: italic;
            }

            p.egik{
                color: darkorange;
                font-style: italic;
            }
        </style>
    </head>
    <body>
        <h1><u>Eğitimlerimiz:</u></h1> <!-- <u> : underline-->
        <h2><u>Temel Bilişim Eğitimleri</u></h2>
            <p class="egik">Windows</p>
            <p>Word</p>
            <p>Excel</p>
            <p>Powerpoint</p>

        <h2><u>İleri Bilişim Eğitimleri</u></h2>
        <p class="egik">HTML</p>
        <p>CSS</p>
        <p>JavaScript</p>
        <p>Python</p>
        <p>Nesne <span id="mi">Tabanlı</span> Programlama</p>
         <!-- <span>: metnin veya satır içi içeriğin belirli bir bölümüne stil, komut dosyası veya yapı uygulamanıza olanak tanır-->
    </body>
</html>
