<!DOCTYPE html>
<html>
    <head>
        <style>
            ul{
                list-style-type: none; /* madde imleri kalkar */
            
            }
            li{
                border-style: solid;
                border-color: darkslategray;
                border-width: 5px;
                border-radius: 10px; /* kutu köşelerini yumuşatır */
                width: 80px;
                padding: 10px;
                float: left; /* butonların yanyana olmasını istiyorum */
                margin: 5px; /* diğer kutularla olan uzaklık */
                text-align: center; /* metinler butonların ortasına geldi */
            }
            ul li a{
                font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
                font-size: 14px;
                text-decoration: none;
            }
            ul li a:hover{/* linkin üzerine gidildiğinde */ 
                color: yellowgreen;
            }

        </style>
    </head>
    <body>
        <ul>
            <li> <a href="index.html">Anasayfa</a> </li>
            <li> <a href="urunler.html">Ürünlerimiz</a> </li>
            <li> <a href="bizlkimiz.html">Biz Kimiz?</a></li>
            <li><a href="iletisim.html">İletişim</a></li>
        </ul>
        
    </body>
</html>
