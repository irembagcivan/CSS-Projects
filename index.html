<!DOCTYPE html>
<html>
    <head>
        <!-- * seçicisi her şeyi seçer-->
        <!-- . ile class oluştururuz-->
        <style>
            *{
                font-size: 20px;
            }
            h1{
                color: blue;
            }
            h2{
                color: green;
            }
            p{
                color: red;
            }
            #bir{
                color: purple;
            }
            #iki{
                color: cornflowerblue;
            }
            .mavi{
                color: blue;
            }
            .yesil{
                color: greenyellow;
            }
        </style>
        
    </head>
    <body>
        <h1 class="yesil">Başlık 1</h1>
        <h2>Merhaba</h2>
        <p id="bir" class=" mavi">Nasılsınız</p> <!-- burada id class dan daha öncelikli olduğu için yazının rengi mor olarak kalır-->
        <p id="iki">İyiyim siz...</p>
    </body>
</html>
