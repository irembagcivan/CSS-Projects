<!DOCTYPE html>
<html>
    <head>
        <style>
            div{
                border-color: black;
                border-style: solid;

            }
            #buyuk{
                width: 200px;
                height: 100px;
                background-color: darkkhaki;
                position: fixed; /* kutunun sayfaya göre ayarlanmasını sağlar */
                right: 0px;
                bottom: 0px;
            }
            #kucuk{
                width: 100px;
                height: 50px;
                background-color: salmon;
                position: absolute; /* başka kutu içinde bulunan kutuları kontrol etmek için kullanılır
                içinde bulunduğu kutuya göre konumu ayarlanır */
                left: 10px;
                top: 10px;
            }
        </style>

    </head>
    <body>
        <div id="buyuk"> <!-- parent-->
            <div id="kucuk"> <!-- child -->

            </div>
        </div> <!-- division(bölüm/kısım) kelimesinden gelir. sayfayı bölümlere
        ve kutulara ayarlamamız sağlar-->
        
    </body>
</html>
