<!DOCTYPE html>
<html>
    <head>
        <style>
            div{
                border-color: black;
                border-style: solid;

            }
            #buyuk{
                width: 200px;
                height: 100px;
                background-color: darkkhaki;
                position: fixed; /* kutunun sayfaya göre ayarlanmasını sağlar */
                right: 0px;
                bottom: 0px;
            }
            #kucuk{
                width: 100px;
                height: 50px;
                background-color: salmon;
                position: relative; /* bulunduğu konuma göre hareket edebilen nesne: relative */
                left: 20px;
                top: 50px;
            }
        </style>

    </head>
    <body>
        <div id="buyuk">

        </div>
        <div id="kucuk">

        </div>
    </body>
</html>
