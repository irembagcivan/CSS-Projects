<!DOCTYPE html>
<html>
    <head>
        <style>
            #sayfa{
                border-style: solid;
                border-color: black;
                border-width: 2px;
                width: 400px;
                min-height: 350px;
                margin: auto;
            }
            header{
                border-style: dotted;
                border-color: red;
                width: 360px;
                height: 50px;
                margin: auto;
                background-color: beige;
            }
            nav{
                border-style: dashed;
                border-color: blue;
                width: 360px;
                height: 30px;
                margin: auto;
                background-color: rgb(220, 245, 225);    
            }
            article{
                border-style: solid;
                border-color: green;
                width: 200px;
                min-height: 200px;
                margin: auto;
                background-color: rgb(245, 220, 220);
                float: left;   
                position: relative; 
                left: 19px; 
            }
            aside{
                border-style: solid;
                border-color: green;
                width: 160px;
                min-height: 200px;
                margin: auto;
                background-color: rgb(226, 220, 245);
                float: right;   
                position: relative;
                right: 19px;        
            }
            footer{
                border-style: double;
                border-color: green;
                width: 360px;
                min-height: 30px;
                margin: auto;
                background-color: rgb(226, 220, 245);
                float: left;   
                position: relative;
                left: 19px;   
            }
        </style>
    </head>
    <body>
        <div id="sayfa">
            <header>
                BURASI BANNER
            </header>
            <nav>
                ANA MENÜ
            </nav>
            <article>
                İÇERİK
            </article>
            <aside>
                YAN MENÜ
            </aside>
            <footer>
                ALT MENÜ
            </footer>
        </div>
    </body>
</html>
