<!DOCTYPE html>
<html>
    <head>
        <style>
            p{

            }
            h1{
                border-style: solid; /* Başlığın etrafına kenarlık çizer. varsayılan none olarak gelir */
                border-width: 10px 20px 30px 40px;
                border-color: mediumvioletred red blue yellow;
                width: 200px; /* Başlık elementinin genişliğini net olarak 200 piksel yapar. */
                height: 80px; /* Başlık elementinin yükseklik değerini 80 piksel olarak sabitler. */
                padding: 35px; /* Kutunun içindeki yazı ile kutu çizgisi arasındaki boşluk. */
                margin: 30px; /* Kutunun dışındaki, diğer nesnelerle arasındaki boşluk. */
            }   /* üst sağ alt sol boşluk olarak 0px 50 px 40px 20px şeklinde de boşlukları belirtebiliriz. */
        </style>
    </head>
    <body>
        <h1>Eğitimlerimiz</h1>
        <h2>Temel Bilişim</h2>
        <p>Windows</p>
        <p>Word</p>
        <p>Excel</p>
    </body>
</html>
